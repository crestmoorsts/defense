<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img"><title>Arbitration conceptual decision flow</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0A0A0B"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica,Arial,sans-serif" fill="#0A0A0B"><text x="40" y="45" font-size="28" font-weight="bold">ARBITRATION: THREE POSSIBLE OUTCOMES</text><text x="40" y="78" font-size="18" fill="#55524D">Public explanation; thresholds and internal doctrine are not specified</text><rect x="275" y="110" width="350" height="90" rx="8" fill="#F4F2EE" stroke="#C23B00"/><text x="295" y="147" font-size="24" font-weight="bold">PROPOSED ACTION</text><text x="295" y="177" font-size="18" fill="#55524D">From the autonomy stack</text><rect x="275" y="250" width="350" height="100" rx="8" fill="#F4F2EE" stroke="#C23B00"/><text x="295" y="287" font-size="24" font-weight="bold">ARBITRATION REVIEW</text><text x="295" y="317" font-size="18" fill="#55524D">Rules, conditions, risk, uncertainty</text><path d="M450,200 L450,250" fill="none" stroke="#0A0A0B" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="420" width="260" height="100" rx="8" fill="#F4F2EE" stroke="#C23B00"/><text x="50" y="457" font-size="24" font-weight="bold">PROCEED</text><text x="50" y="487" font-size="18" fill="#55524D">Within authorized scope</text><rect x="320" y="420" width="260" height="100" rx="8" fill="#F4F2EE" stroke="#C23B00"/><text x="340" y="457" font-size="24" font-weight="bold">PAUSE</text><text x="340" y="487" font-size="18" fill="#55524D">Conditions require a hold</text><rect x="610" y="420" width="260" height="100" rx="8" fill="#F4F2EE" stroke="#C23B00"/><text x="630" y="457" font-size="24" font-weight="bold">HUMAN REVIEW</text><text x="630" y="487" font-size="18" fill="#55524D">Explicit decision required</text><path d="M450,350 L450,385 L160,385 L160,420 M450,385 L450,420 M450,385 L740,385 L740,420" fill="none" stroke="#0A0A0B" stroke-width="2"/><text x="40" y="570" font-size="18">Consequential decisions remain under human authority.</text><text x="40" y="605" font-size="18">Illustrative flow only. No autonomous weapon employment is depicted.</text></g></svg>